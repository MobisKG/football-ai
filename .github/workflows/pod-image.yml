name: pod-image
# Собирает образ рабочей машины RunPod и кладёт его в ghcr.io/mobiskg/football-pod.
# Запускается вручную или при изменении docker/pod.Dockerfile.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [docker/pod.Dockerfile, .github/workflows/pod-image.yml]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Освободить место (базовый образ ~10 ГБ)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/pod.Dockerfile
          push: true
          tags: ghcr.io/mobiskg/football-pod:latest
